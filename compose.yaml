services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: surgimap
      POSTGRES_USER: surgimap
      POSTGRES_PASSWORD: surgimap
    ports:
      - "5432:5432"
    volumes:
      - surgimap-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surgimap -d surgimap"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  surgimap-postgres-data:
